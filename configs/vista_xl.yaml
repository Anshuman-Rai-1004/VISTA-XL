
experiment:
  name: vista_xl_mlstm_swin_tiny
  seed: 42

data:
  image_size: 224
  train_directory: Dataset/training_data
  validation_directory: Dataset/validation_data
  batch_size: 8
  num_workers: 0
  imagenet_normalization: true

model:
  encoder: swin_tiny_patch4_window7_224
  pretrained: true
  mlstm_embedding_dim: 768
  mlstm_num_heads: 4
  mlstm_context_length: 49
  output_channels: 1

training:
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  loss: bce_dice
  threshold: 0.5
  mixed_precision: true

checkpoint:
  save_best_only: true
  selection_metric: val_dice
  directory: checkpoints/vista_xl

output:
  results_directory: results/vista_xl
  history_file: vista_xl_training_history.csv
